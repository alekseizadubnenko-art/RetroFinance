<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroFinance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "retro-bg": "#fcfaf7",
                        "retro-border": "#111418",
                        "accent-orange": "#e85d04",
                        "accent-yellow": "#ffba08",
                        "accent-green": "#2a9d8f",
                        "card-beige": "#ffeebb",
                        "card-pink": "#ffe4e1",
                        "card-retro": "#faedcd",
                        "card-light": "#fefae0",
                        "retro-action": "#ef4444",
                    },
                    fontFamily: {
                        "mono": ["JetBrains Mono", "monospace"],
                        "sans": ["Inter", "sans-serif"]
                    },
                    boxShadow: {
                        "retro": "4px 4px 0px 0px #111418",
                        "retro-sm": "2px 2px 0px 0px #111418",
                        "retro-hover": "1px 1px 0px 0px #111418",
                    },
                },
            },
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fcfaf7;
        }
        ::-webkit-scrollbar-thumb {
            background: #111418;
            border: 2px solid #fcfaf7;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #333;
        }
        body {
            border: 4px solid #111418;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body class="bg-retro-bg text-retro-border font-mono antialiased">
    <div id="root"></div>
</body>
</html>
